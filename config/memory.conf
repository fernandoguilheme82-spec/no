# Dados KEY=VALUE, nunca executados como código. Valores em MiB.
PROFILE=equilibrado
# auto calcula um teto usando total, disponível e cgroups.
HEAP_MAX_MB=auto
HEAP_MIN_MB=256
RESERVED_MB=1024
MAX_AUTO_HEAP_MB=2048
CRITICAL_AVAILABLE_MB=256
CRITICAL_SAMPLES=3
# stop | restart. restart recalcula heap e respeita limite de tentativas.
CRITICAL_ACTION=restart
