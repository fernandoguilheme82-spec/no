name: Validate SMART VANILLA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Dependências de validação
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Sintaxe e estrutura
        run: |
          /usr/bin/python3 tests/validate.py
          shellcheck -S warning -e SC1091 ./*.sh scripts/*.sh
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Memória, backups, restauração e supervisor (processo simulado)
        run: /usr/bin/python3 -m unittest discover -s tests -v
  official-jar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Download Mojang e integridade da 1.12.2
        run: bash scripts/download-server.sh
      - name: Java 8 real, sem aceitar EULA automaticamente
        run: python3 tests/real_smoke.py
      - name: Exportar logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-jar-validation-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
  java8-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Instalar Java 8 ARM64 com SHA-256 oficial
        run: |
          test "$(uname -m)" = aarch64
          python3 scripts/smart.py install-java
          bash scripts/check-java.sh
      - name: Download e execução oficial em Linux ARM64, eula=false
        run: |
          bash scripts/download-server.sh
          python3 tests/real_smoke.py
      - name: Exportar logs ARM64
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-arm64-validation-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
